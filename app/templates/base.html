
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Help Desk Automation</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="navbar">
    <div class="brand">IT Help Desk</div>
    <nav>
        <a href="{{ url_for('main.index') }}">Dashboard</a>
        <a href="{{ url_for('main.new_ticket') }}">Create Ticket</a>
    </nav>
</header>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer>
    IT Help Desk & Incident Management System
    <br>
    Powered by Python, Flask and Ansible
</footer>

</body>
</html>
